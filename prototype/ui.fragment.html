<script>

const main=root.querySelector('.nl-main');
const posts=[
{id:'1',title:'给想法一个属于自己的地方',category:'随笔',tag:'生活与思考',date:'2026.10.31',time:'5 分钟',excerpt:'在信息不停流动的世界里，搭建一处安静的角落。记录技术，也记录生活里微小而确定的瞬间。',status:'published',likes:128,markdown:'# 从一扇窗开始\n\n我想要一个属于自己的地方，放下代码，也放下生活里那些不想忘记的瞬间。\n\n## 为什么还要写博客\n\n信息流很快，而文字可以慢一点。在自己的空间里，记录比表达更自由。\n\n> 不是每一次出发都需要目的地，有时只是想把路上的光留住。\n\n## 让写作保持简单\n\n打开编辑器，写下一段文字，预览，然后发布。好的工具应该让注意力回到内容本身。'},

const drafts=new Map(posts.map(p=>[p.id,{...p}]));
const saved=window.openai?.widgetState;
const defaultSite={name:'夜航',englishName:'NIGHTLOG',description:'关于代码、生活，以及那些值得留下的瞬间。',motion:true};
function cleanSite(value){const v=value&&typeof value==='object'?value:{};return {name:typeof v.name==='string'&&v.name.trim()?v.name.trim().slice(0,24):defaultSite.name,englishName:typeof v.englishName==='string'?v.englishName.trim().slice(0,40):defaultSite.englishName,description:typeof v.description==='string'?v.description.trim().slice(0,120):defaultSite.description,motion:typeof v.motion==='boolean'?v.motion:true}}
let localSite;try{localSite=JSON.parse(localStorage.getItem('nightlog.site.v1')||'null')}catch{}
let site=cleanSite(saved?.privateContent?.site||localSite);
let motionPaused=false,heroVisible=true,motionObserver;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function updateBrand(){root.querySelector('[data-site-name]').textContent=site.name;root.querySelector('[data-site-en]').textContent=site.englishName;root.querySelector('[data-site-copyright]').textContent='© 2026 '+site.name+' · 把想法写进生活';root.setAttribute('aria-label',site.name+'博客设计预览');document.title=site.name+' · 个人博客'}
function syncMotion(){const video=root.querySelector('[data-hero-video]'),button=root.querySelector('[data-motion-toggle]');if(!video||!button)return;const off=!site.motion||reducedMotion.matches;const stop=off||motionPaused||document.hidden||!heroVisible;video.hidden=off;button.disabled=off;button.textContent=off?'静态背景':motionPaused?'播放背景':'暂停背景';button.setAttribute('aria-pressed',String(!stop));if(stop)video.pause();else video.play().catch(error=>{if(!video.isConnected||video!==root.querySelector('[data-hero-video]')||error.name==='AbortError')return;button.textContent='播放背景';button.setAttribute('aria-pressed','false');motionPaused=true})}
document.addEventListener('visibilitychange',syncMotion);
reducedMotion.addEventListener('change',syncMotion);
let view=['home','posts','article','guestbook','collection','admin','editor','inbox','settings'].includes(saved?.modelContent?.view)?saved.modelContent.view:'home';
let liked=new Set((saved?.privateContent?.liked||[]).filter(x=>['1','2','3'].includes(x)));
let bookmarked=new Set((saved?.privateContent?.bookmarked||['2']).filter(x=>['1','2','3'].includes(x)));
let currentID='1',collectionTab='bookmarks',listFilter='全部',adminFilter='all',query='',inboxFilter='all',preview=false,editingID='3';
let nextID=4;
let comments=[{id:'c1',postID:'1',name:'小舟',text:'很喜欢这里的氛围。比起不断刷新的信息流，我也更愿意慢慢读完一篇认真写下的文章。',time:'今天 14:32',reply:'谢谢你停下来读这些文字。希望这里能一直是个安静的小角落。',read:true,hidden:false},{id:'c2',postID:'2',name:'阿远',text:'很期待后续分享，想看看文章预览和线上内容是怎么保持一致的。',time:'今天 11:18',reply:'',read:false,hidden:false},{id:'c3',postID:null,name:'山野',text:'偶然路过，留下一句问候。愿我们都能持续写作，保持好奇。',time:'昨天 20:15',reply:'欢迎常来坐坐。',read:true,hidden:false}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const published=()=>posts.filter(p=>p.status==='published');
const byID=id=>posts.find(p=>p.id===id);
const persist=()=>window.openai?.setWidgetState?.({modelContent:{view},privateContent:{liked:[...liked],bookmarked:[...bookmarked],site}})?.catch(()=>{});
let toastTimer;function toast(message){const box=root.querySelector('.nl-toast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,2800)}
function status(p){return `<span class="nl-status ${p.status}">${p.status==='published'?'● 已发布':p.status==='draft'?'○ 草稿':'○ 回收站'}</span>`}
function tag(p){return `<span class="nl-tag ${p.category==='技术'?'nl-tag-cool':''}">${esc(p.tag)}</span>`}
function meta(p){return `<div class="nl-meta"><span>${p.date}</span><span>${p.time}阅读</span><span>${p.likes+(liked.has(p.id)?1:0)} 次喜欢</span></div>`}
function card(p){return `<article class="nl-card"><div class="nl-cover ${p.category==='技术'?'nl-cover-code':'nl-cover-photo'}">${p.category==='技术'?'<div class="nl-code-art"><em>func</em> main() {<br>　ideas := <em>"hello, world"</em><br>　write(ideas)<br>}</div>':''}</div><div class="nl-card-body">${tag(p)}<button class="nl-card-title cursor-interaction" data-open="${p.id}"><h3>${esc(p.title)}</h3></button><p>${esc(p.excerpt)}</p><div class="nl-card-foot"><span>${p.date} · ${p.time}</span><button class="nl-textbtn cursor-interaction" data-open="${p.id}">阅读全文 ↗</button></div></div></article>`}
function home(){return `<section class="nl-hero"><video class="nl-hero-video" data-hero-video src="__MOTION__" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video><button class="nl-motion-control cursor-interaction" data-motion-toggle aria-pressed="true">暂停背景</button><div class="nl-eyebrow">A quiet corner of the internet</div><h1>记录所想，<br>奔赴<span class="nl-gradient">热爱。</span></h1><p>${esc(site.description)}</p><div class="nl-actions"><button class="nl-btn nl-btn-glass cursor-interaction" data-view="posts">开始阅读　↗</button><button class="nl-btn nl-btn-glass cursor-interaction" data-view="guestbook">留一句话</button></div><div class="nl-note">WRITE A LITTLE. LIVE A LOT.</div></section><div class="nl-wrap"><section class="nl-feature"><div><div class="nl-label">EDITOR'S PICK / 本期精选</div><button class="nl-card-title cursor-interaction" data-open="1"><h2>给想法一个属于自己的地方</h2></button><div class="nl-meta"><span>随笔</span><span>2026.10.31</span><span>5 分钟阅读</span></div></div><button class="nl-orbit cursor-interaction" data-open="1" aria-label="阅读精选文章">↗</button></section><div class="nl-sectionhead"><div><h2>最近写下的</h2><small>NOTES & STORIES</small></div><button class="nl-textbtn cursor-interaction" data-view="posts">全部文章 ↗</button></div><div class="nl-grid">${published().slice(0,2).map(card).join('')}</div></div>`}
function postList(){const filtered=published().filter(p=>(listFilter==='全部'||p.category===listFilter)&&p.title.toLowerCase().includes(query.toLowerCase()));return `<section class="nl-page"><div class="nl-pagehead"><div class="nl-eyebrow">The journal</div><h1>写下的，都是<span class="nl-gradient">来过的。</span></h1><p>技术笔记与日常碎片，在这里慢慢生长。</p></div><label class="nl-field">搜索文章<input class="nl-search" data-search="posts" placeholder="输入文章标题…" value="${esc(query)}"></label><div class="nl-tabs">${['全部','技术','随笔'].map(x=>`<button class="nl-tab cursor-interaction ${listFilter===x?'is-active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="nl-grid">${filtered.map(card).join('')}</div>${filtered.length?'':'<div class="nl-empty">没有找到文章，试试其他关键词。</div>'}</section>`}
function markdown(s){return s.split('\n\n').map(block=>{if(block.startsWith('### '))return '<h3>'+esc(block.slice(4))+'</h3>';if(block.startsWith('## '))return '<h2>'+esc(block.slice(3))+'</h2>';if(block.startsWith('# '))return '<h2>'+esc(block.slice(2))+'</h2>';if(block.startsWith('> '))return '<blockquote>'+esc(block.slice(2))+'</blockquote>';return '<p>'+esc(block).replace(/\n/g,'<br>')+'</p>'}).join('')}
function commentHTML(c){return `<div class="nl-comment"><span class="nl-avatar">${esc(c.name.slice(0,1))}</span><div class="nl-comment-content"><div class="nl-comment-name"><span>${esc(c.name)}</span><span class="nl-comment-time">${esc(c.time)}</span>${c.name==='林间'?`<button class="nl-textbtn cursor-interaction" data-del-comment="${c.id}">删除</button>`:''}</div><p>${esc(c.text)}</p>${c.reply?`<div class="nl-reply"><div class="nl-comment-name">${esc(site.name)} <span class="nl-tag">博主</span></div><p>${esc(c.reply)}</p></div>`:''}</div></div>`}
function composer(context){return `<form class="nl-composer" data-comment-form="${context}"><label class="nl-field">${context==='guestbook'?'留下一点想说的话':'聊聊你的想法'}<textarea class="nl-search" name="body" required maxlength="2000" placeholder="此刻的想法，也值得被记录。"></textarea></label><div class="nl-spread"><span class="nl-comment-time">以「林间」的身份留言 · 最多 2000 字</span><button type="submit" class="nl-btn nl-btn-primary cursor-interaction">发布留言 ↗</button></div></form>`}
function article(){const p=(preview?drafts.get(currentID):byID(currentID))||posts[0];const visible=comments.filter(c=>c.postID===p.id&&!c.hidden);return `${preview?'<div class="nl-banner"><span>草稿预览 · 尚未发布</span><button class="nl-textbtn cursor-interaction" data-view="editor">返回编辑器 ↗</button></div>':''}<div class="nl-article-top"><button class="nl-textbtn cursor-interaction" data-view="posts">← 所有文章</button><div style="margin-top:20px">${tag(p)}</div><h1>${esc(p.title)}</h1><p class="nl-article-intro">${esc(p.excerpt)}</p>${meta(p)}</div><div class="nl-reading"><div><article class="nl-prose">${markdown(p.markdown)}</article>${preview?'':`<div class="nl-reactions"><button class="nl-btn cursor-interaction ${liked.has(p.id)?'nl-selected':''}" aria-pressed="${liked.has(p.id)}" data-like="${p.id}">${liked.has(p.id)?'♥ 已点赞':'♡ 点赞'} · ${p.likes+(liked.has(p.id)?1:0)}</button><button class="nl-btn cursor-interaction ${bookmarked.has(p.id)?'nl-selected':''}" aria-pressed="${bookmarked.has(p.id)}" data-bookmark="${p.id}">${bookmarked.has(p.id)?'已收藏 ✓':'收藏文章 ＋'}</button><span class="nl-comment-time">留住值得再读的文字</span></div><section class="nl-comment-section"><h2 style="font-size:22px">评论 <span style="color:var(--nl-muted);font-size:14px">${visible.length}</span></h2>${composer(p.id)}${visible.map(commentHTML).join('')}</section>`}</div><aside class="nl-toc"><strong>ON THIS PAGE</strong><a href="#" data-toc="0">从这里开始</a><a href="#" data-toc="1">为什么写下这些</a><a href="#" data-toc="2">保持简单</a><div style="margin-top:32px;color:var(--nl-amber)">文字有光，<br>夜航有岸。</div></aside></div>`}
function guestbook(){const items=comments.filter(c=>c.postID===null&&!c.hidden);return `<section class="nl-page" style="max-width:800px;margin:auto"><div class="nl-pagehead"><div class="nl-eyebrow">Leave a little light</div><h1>很高兴，<span class="nl-gradient">你来过。</span></h1><p>一个问候，一个想法，或是最近让你开心的小事。</p></div>${composer('guestbook')}<div class="nl-sectionhead"><h2>窗边的对话</h2><span class="nl-comment-time">${items.length} 条留言</span></div>${items.map(commentHTML).join('')}</section>`}
function collection(){const ids=collectionTab==='bookmarks'?bookmarked:liked;const items=posts.filter(p=>ids.has(p.id));return `<section class="nl-page"><div class="nl-pagehead"><div class="nl-eyebrow">Your reading corner</div><h1>留给<span class="nl-gradient">下一次阅读。</span></h1><p>你好，林间。这里收好了你喜欢的文字。</p></div><div class="nl-tabs"><button class="nl-tab cursor-interaction ${collectionTab==='bookmarks'?'is-active':''}" data-collection="bookmarks">我的收藏 · ${bookmarked.size}</button><button class="nl-tab cursor-interaction ${collectionTab==='likes'?'is-active':''}" data-collection="likes">我的点赞 · ${liked.size}</button></div>${items.map(p=>`<article class="nl-list-row"><div>${p.status==='published'?`${tag(p)}<button class="nl-card-title cursor-interaction" data-open="${p.id}"><h3>${esc(p.title)}</h3></button><p>${esc(p.excerpt)}</p>${meta(p)}`:'<h3>文章暂不可用</h3><p>作者暂时收起了这篇文章。</p>'}</div><button class="nl-btn cursor-interaction" ${collectionTab==='bookmarks'?`data-bookmark="${p.id}"`:`data-like="${p.id}"`}>${collectionTab==='bookmarks'?'取消收藏':'取消点赞'}</button></article>`).join('')}${items.length?'':'<div class="nl-empty">这里还是空的。去读一篇喜欢的文章吧。<br><button class="nl-textbtn cursor-interaction" data-view="posts">探索文章 ↗</button></div>'}</section>`}
function adminShell(content,active){return `<div class="nl-admin"><aside class="nl-sidebar"><div class="nl-sidebar-title">WRITING STUDIO</div><button class="cursor-interaction ${active==='admin'?'is-active':''}" data-view="admin">文章管理</button><button class="cursor-interaction ${active==='editor'?'is-active':''}" data-view="editor">写一篇文章</button><button class="cursor-interaction ${active==='inbox'?'is-active':''}" data-view="inbox">评论与留言　${comments.filter(c=>!c.read).length||''}</button><button class="cursor-interaction ${active==='settings'?'is-active':''}" data-view="settings">站点设置</button><button class="cursor-interaction" data-view="home">返回博客 ↗</button></aside><section class="nl-admin-body">${content}</section></div>`}
function admin(){const items=posts.filter(p=>(adminFilter==='all'?p.status!=='trashed':p.status===adminFilter)&&p.title.toLowerCase().includes(query.toLowerCase()));return adminShell(`<div class="nl-spread"><div><h1>文章管理</h1><p class="nl-admin-sub">每一个想法，都从这里开始。</p></div><button class="nl-btn nl-btn-gradient cursor-interaction" data-new>＋ 写文章</button></div><div class="nl-admin-tools"><input class="nl-search" aria-label="搜索后台文章" data-search="admin" placeholder="搜索文章标题…" value="${esc(query)}"></div><div class="nl-tabs">${[['all','全部'],['published','已发布'],['draft','草稿'],['trashed','回收站']].map(([v,t])=>`<button class="nl-tab cursor-interaction ${adminFilter===v?'is-active':''}" data-admin-filter="${v}">${t}</button>`).join('')}</div><table class="nl-table"><thead><tr><th>文章</th><th>状态</th><th class="nl-hide-mobile">更新日期</th><th>操作</th></tr></thead><tbody>${items.map(p=>`<tr><td><button class="nl-card-title cursor-interaction" data-edit="${p.id}">${esc(p.title)}</button><small>${esc(p.category)} · ${p.time}</small></td><td>${status(p)}</td><td class="nl-hide-mobile" style="color:var(--nl-muted)">${p.date}</td><td><div class="nl-table-actions">${p.status==='trashed'?`<button class="cursor-interaction" data-restore="${p.id}">恢复</button>`:`<button class="cursor-interaction" data-edit="${p.id}">编辑</button><button class="cursor-interaction" data-preview="${p.id}">预览</button><button class="cursor-interaction nl-danger" data-trash="${p.id}">删除</button>`}</div></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="nl-empty">没有符合条件的文章。</div>'}<p class="nl-admin-sub" style="margin-top:20px">共 ${items.length} 篇 · 删除后可从回收站恢复</p>`, 'admin')}
function editor(){const p=drafts.get(editingID)||posts[2];return adminShell(`<div class="nl-spread nl-editor-head"><div><button class="nl-textbtn cursor-interaction" data-view="admin">← 文章管理</button><h1 style="margin-top:8px">安静地，写一点。</h1><p class="nl-admin-sub" data-save-label>草稿 · 修改后点击保存</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="nl-btn cursor-interaction" data-save>保存草稿</button><button class="nl-btn cursor-interaction" data-editor-preview>预览</button><button class="nl-btn nl-btn-gradient cursor-interaction" data-publish>发布文章 ↗</button></div></div><label class="nl-field">文章标题<input class="nl-editor-title" data-title value="${esc(p.title)}" placeholder="为这个想法起一个名字"></label><div class="nl-editor-meta"><label class="nl-field">分类<select class="nl-search" data-category><option ${p.category==='随笔'?'selected':''}>随笔</option><option ${p.category==='技术'?'selected':''}>技术</option></select></label><label class="nl-field">摘要<input class="nl-search" data-excerpt value="${esc(p.excerpt)}" placeholder="一两句话介绍文章"></label></div><div class="nl-spread"><span class="nl-editor-label">MARKDOWN / 写作</span><span class="nl-editor-label">实时预览</span></div><div class="nl-editor"><label style="min-width:0"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Markdown 正文</span><textarea data-markdown spellcheck="false">${esc(p.markdown)}</textarea></label><div class="nl-editor-preview"><div class="nl-prose" data-live-preview>${markdown(p.markdown)}</div></div></div><div class="nl-spread"><span class="nl-admin-sub" data-word-count>${p.markdown.length} 字符 · Markdown 格式</span><span class="nl-admin-sub">写完之前，允许想法不完美。</span></div>`, 'editor')}
function inbox(){const items=comments.filter(c=>inboxFilter==='all'||inboxFilter==='unread'&&!c.read||inboxFilter==='unreplied'&&!c.reply);return adminShell(`<h1>窗边的回声</h1><p class="nl-admin-sub">读者的评论与留言，都在这里。</p><div class="nl-tabs">${[['all','全部'],['unread','未读'],['unreplied','待回复']].map(([v,t])=>`<button class="nl-tab cursor-interaction ${inboxFilter===v?'is-active':''}" data-inbox-filter="${v}">${t}</button>`).join('')}</div>${items.map(c=>`<article class="nl-inbox-item">${commentHTML(c)}<div class="nl-source">来自 ${c.postID?`文章「${esc(byID(c.postID)?.title||'已删除文章')}」`:'留言板'} · ${c.read?'已读':'未读'}${c.hidden?' · 已隐藏':''}</div><div class="nl-table-actions" style="margin-top:13px"><button class="cursor-interaction" data-reply-open="${c.id}">${c.reply?'修改回复':'回复'}</button><button class="cursor-interaction" data-read="${c.id}">标为已读</button><button class="cursor-interaction" data-hide="${c.id}">${c.hidden?'恢复显示':'隐藏'}</button></div><form data-reply-form="${c.id}" hidden style="margin-top:15px"><label class="nl-field">以博主身份回复<textarea class="nl-search" name="reply" maxlength="2000" required>${esc(c.reply)}</textarea></label><button type="submit" class="nl-btn nl-btn-primary cursor-interaction">${c.reply?'保存回复':'发送回复'}</button></form></article>`).join('')}${items.length?'':'<div class="nl-empty">已处理完所有对话，去写点新东西吧。</div>'}`, 'inbox')}
function settings(){return adminShell(`<div class="nl-settings-head"><div class="nl-eyebrow">Make it yours</div><h1>你的名字，你的空间。</h1><p class="nl-admin-sub">为博客取一个名字，让每一次相遇都有迹可循。</p></div><div class="nl-settings-grid"><form data-site-form><label class="nl-field">博客名称 <span class="nl-field-note">显示在导航、页脚和博主回复中</span><input class="nl-search" name="name" value="${esc(site.name)}" required maxlength="24" placeholder="给你的博客起个名字"></label><label class="nl-field">英文名称 <span class="nl-field-note">可选，用于导航标识的副标题</span><input class="nl-search" name="english_name" value="${esc(site.englishName)}" maxlength="40" placeholder="NIGHTLOG"></label><label class="nl-field">博客简介<textarea class="nl-search" name="description" maxlength="120">${esc(site.description)}</textarea></label><label class="nl-motion-setting"><input type="checkbox" name="motion" ${site.motion?'checked':''}><span>动态雨夜背景<small>静音循环播放，支持暂停；减少动态效果时显示静态封面。</small></span></label><button type="submit" class="nl-btn nl-btn-gradient cursor-interaction">保存设置 ↗</button><p class="nl-admin-sub" style="margin-top:13px" data-settings-status>配置保存在当前浏览器，重新打开仍然生效。</p></form><aside class="nl-brand-preview"><div class="nl-eyebrow">Brand preview</div><span class="nl-mark">n.</span><h2 data-brand-preview-name>${esc(site.name)}</h2><div class="nl-word" data-brand-preview-en>${esc(site.englishName)}</div><p data-brand-preview-description>${esc(site.description)}</p><span class="nl-comment-time">写下自己的故事。</span></aside></div>`, 'settings')}
const renderers={home,posts:postList,article,guestbook,collection,admin,editor,inbox,settings};
function render(){motionObserver?.disconnect();main.innerHTML=renderers[view]();updateBrand();heroVisible=true;const hero=root.querySelector('.nl-hero');if(hero){const video=root.querySelector('[data-hero-video]');video.muted=true;syncMotion();if(globalThis.IntersectionObserver){motionObserver=new IntersectionObserver(entries=>{heroVisible=entries[0].isIntersecting;syncMotion()});motionObserver.observe(hero)}}root.querySelectorAll('.nl-links [data-view]').forEach(b=>b.classList.toggle('is-active',b.dataset.view===view||(view==='article'&&b.dataset.view==='posts')||(['editor','inbox','settings'].includes(view)&&b.dataset.view==='admin')))}
function go(next){view=next;query='';if(next!=='article')preview=false;render();persist()}
function syncEditor(){const p=drafts.get(editingID);if(!p||!root.querySelector('[data-title]'))return false;const title=root.querySelector('[data-title]').value.trim();const body=root.querySelector('[data-markdown]').value;if(!title||!body.trim()){toast('请先填写文章标题和正文');return false}p.title=title;p.markdown=body;p.excerpt=root.querySelector('[data-excerpt]').value;p.category=root.querySelector('[data-category]').value;p.tag=p.category==='技术'?'工程实践':'生活与思考';return true}
root.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
if('motionToggle'in d){motionPaused=!motionPaused;syncMotion();return}
if(d.view){go(d.view);return}
if(d.open){currentID=d.open;preview=false;go('article');return}
if(d.like||d.bookmark){const id=d.like||d.bookmark;const set=d.like?liked:bookmarked;const was=set.has(id);set[was?'delete':'add'](id);render();persist();toast(d.like?(was?'已取消点赞':'谢谢你的喜欢'):(was?'已取消收藏':'已加入我的收藏'));return}
if(d.filter){listFilter=d.filter;render();return}
if(d.collection){collectionTab=d.collection;render();return}
if(d.adminFilter){adminFilter=d.adminFilter;render();return}
if(d.inboxFilter){inboxFilter=d.inboxFilter;render();return}
if(d.edit){editingID=d.edit;go('editor');return}
if(d.preview){currentID=d.preview;preview=true;view='article';render();persist();return}
if('new'in d){const p={id:String(nextID++),title:'',category:'随笔',tag:'生活与思考',date:'2026.10.31',time:'1 分钟',excerpt:'',status:'draft',likes:0,markdown:''};posts.push(p);drafts.set(p.id,{...p});editingID=p.id;go('editor');return}
if(d.trash){byID(d.trash).status='trashed';render();toast('已移入回收站，可随时恢复');return}
if(d.restore){byID(d.restore).status='draft';render();toast('已恢复为草稿');return}
if('save'in d){if(syncEditor()){root.querySelector('[data-save-label]').textContent='已保存到本次预览 · 刷新后重置';toast('草稿已保存到本次预览')}return}
if('editorPreview'in d){if(syncEditor()){currentID=editingID;preview=true;view='article';render();persist()}return}
if('publish'in d){if(syncEditor()){Object.assign(byID(editingID),drafts.get(editingID),{status:'published'});go('admin');toast('文章已发布到演示首页')}return}
if(d.replyOpen){const form=root.querySelector(`[data-reply-form="${d.replyOpen}"]`);form.hidden=!form.hidden;if(!form.hidden)form.querySelector('textarea').focus();return}
if(d.read){comments.find(c=>c.id===d.read).read=true;render();toast('已标为已读');return}
if(d.hide){const c=comments.find(c=>c.id===d.hide);c.hidden=!c.hidden;render();toast(c.hidden?'内容已从前台隐藏':'已恢复前台显示');return}
if(d.delComment){comments=comments.filter(c=>c.id!==d.delComment);render();toast('你的留言已删除');return}
if(d.toc!==undefined){e.preventDefault();const headings=root.querySelectorAll('.nl-prose h2');headings[Math.min(Number(d.toc),headings.length-1)]?.scrollIntoView({behavior:'auto',block:'center'})}
});
root.addEventListener('input',e=>{if(e.target.closest('[data-site-form]')){const f=e.target.form;root.querySelector('[data-brand-preview-name]').textContent=f.elements.name.value.trim()||'你的博客';root.querySelector('[data-brand-preview-en]').textContent=f.elements.english_name.value;root.querySelector('[data-brand-preview-description]').textContent=f.elements.description.value;}if(e.target.matches('[data-markdown]')){root.querySelector('[data-live-preview]').innerHTML=markdown(e.target.value);root.querySelector('[data-word-count]').textContent=e.target.value.length+' 字符 · Markdown 格式'}if(e.target.matches('[data-title],[data-markdown],[data-excerpt]')){root.querySelector('[data-save-label]').textContent='有未保存的修改'}if(e.target.dataset.search){query=e.target.value;const pos=e.target.selectionStart;render();const input=root.querySelector('[data-search]');input.focus();input.setSelectionRange(pos,pos)}});
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.hasAttribute('data-site-form')){const name=f.elements.name.value.trim();if(!name){toast('请输入博客名称');return}site=cleanSite({name,englishName:f.elements.english_name.value,description:f.elements.description.value,motion:f.elements.motion.checked});let stored=false;try{localStorage.setItem('nightlog.site.v1',JSON.stringify(site));stored=true}catch{}persist();render();root.querySelector('[data-settings-status]').textContent=stored?'设置已保存，刷新或重新打开仍然生效。':'当前环境不允许浏览器存储；配置已应用到本次预览。';toast('站点设置已保存，前台已同步更新');return}if(f.dataset.commentForm){const text=f.elements.body.value.trim();if(!text){toast('写一点内容再发送吧');return}comments.unshift({id:'c'+Date.now(),postID:f.dataset.commentForm==='guestbook'?null:f.dataset.commentForm,name:'林间',text,time:'刚刚',reply:'',read:false,hidden:false});render();toast('留言已发布，感谢你的分享')}if(f.dataset.replyForm){const c=comments.find(x=>x.id===f.dataset.replyForm);const text=f.elements.reply.value.trim();if(!text){toast('请输入回复内容');return}c.reply=text;c.read=true;render();toast('回复已发送，前台已可查看')}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(!s)return;const valid=x=>Array.isArray(x)?x.filter(v=>posts.some(p=>p.id===v)):[];if(s.privateContent){if(s.privateContent.site)site=cleanSite(s.privateContent.site);liked=new Set(valid(s.privateContent.liked));bookmarked=new Set(valid(s.privateContent.bookmarked))}if(renderers[s.modelContent?.view])view=s.modelContent.view;render()});
render();
if(globalThis.Tweak){const design={radius:20,shade:.36};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--nl-radius',design.radius+'px');root.style.setProperty('--nl-shade',design.shade)}});tweak.addSlider(design,'radius',{label:'面板圆角',min:8,max:32,unit:'px'});tweak.addSlider(design,'shade',{label:'背景遮罩',min:.15,max:.75,step:.05})}
})();
</script>
</div>
